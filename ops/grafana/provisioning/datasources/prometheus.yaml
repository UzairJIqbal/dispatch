apiVersion: 1
datasources:
  - name: Prometheus
    # A fixed uid: the dashboard and the alert rules point at it by name.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # The scrape interval, so $__rate_interval is never shorter than 4 scrapes.
      timeInterval: 15s
