# `GIT_SHA=$(git rev-parse --short HEAD) docker compose up --build`
# Without GIT_SHA the image says git_sha "unknown" (and logs a warning).
services:
  dispatch:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: dispatch:${GIT_SHA:-dev}
    env_file: .env
    environment:
      # The mock unless you say otherwise, so a local run spends no real calls.
      # DISPATCH_PROVIDER=gemini docker compose up  →  the real model.
      DISPATCH_PROVIDER: ${DISPATCH_PROVIDER:-mock}
    ports:
      # Host side is changeable when 3000 is taken by something else on this machine.
      - "${DISPATCH_HOST_PORT:-3000}:3000"
    # Longer than the service's own 15 s drain, so it exits by itself first.
    stop_grace_period: 30s
